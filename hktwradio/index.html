<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HK TW Radio — Get the app</title>
<meta name="description" content="HK TW Radio — Hong Kong &amp; Taiwan radio stations, all in one app. Download for iPhone or Android.">
<meta name="theme-color" content="#0a0a0a">
<!-- Open Graph so the shared link previews nicely in Messages / WhatsApp / etc. -->
<meta property="og:title" content="HK TW Radio">
<meta property="og:description" content="Hong Kong &amp; Taiwan radio, all in one app.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://likelylabs.com/hktwradio">
<meta property="og:image" content="https://likelylabs.com/hktwradio/icon.png">
<link rel="icon" href="icon.png">
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --text:#111; --muted:#6b6b70; --line:#e6e6ea;
    --btn:#111; --btn-text:#fff; --gold:#c8961e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000; --card:#141416; --text:#f5f5f7; --muted:#9a9aa0; --line:#26262b; --btn:#fff; --btn-text:#000; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:420px; text-align:center;
    background:var(--card); border:1px solid var(--line); border-radius:24px;
    padding:40px 28px 32px; box-shadow:0 20px 60px rgba(0,0,0,.08);
  }
  .icon{
    width:96px; height:96px; border-radius:22px; margin:0 auto 20px;
    display:block; object-fit:cover;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
  }
  h1{ font-size:28px; margin:0 0 4px; letter-spacing:-.5px; }
  .zh{ color:var(--muted); font-size:16px; margin:0 0 6px; }
  .tag{ color:var(--muted); font-size:15px; margin:0 0 28px; }
  .btns{ display:flex; flex-direction:column; gap:12px; }
  a.store{
    display:flex; align-items:center; justify-content:center; gap:10px;
    text-decoration:none; font-weight:600; font-size:16px;
    background:var(--btn); color:var(--btn-text);
    padding:15px 18px; border-radius:14px; transition:transform .12s ease, opacity .12s ease;
  }
  a.store:active{ transform:scale(.98); opacity:.9; }
  a.store svg{ height:20px; width:auto; fill:currentColor; }
  .hint{ margin-top:22px; font-size:13px; color:var(--muted); min-height:18px; }
  .hint a{ color:var(--gold); }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="icon.png" width="96" height="96" alt="HK TW Radio">

    <h1>HK TW Radio</h1>
    <p class="tag">Hong Kong &amp; Taiwan radio, all in one app.</p>

    <div class="btns">
      <a class="store" id="ios" href="#">
        <svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        Download on the App Store
      </a>
      <a class="store" id="android" href="#">
        <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l220.7-221.3 60.1 60.1L104.6 499z"/></svg>
        Get it on Google Play
      </a>
    </div>

    <p class="hint" id="hint"></p>
  </main>

<script>
(function () {
  // Store links (kept here so the page is the single source of truth).
  var IOS = "https://apps.apple.com/app/id1248884143";
  var ANDROID = "https://play.google.com/store/apps/details?id=com.likelylabs.hktwradio";

  // Preserve a ?src= attribution tag if present (e.g. likelylabs.com/hktwradio?src=whatsapp).
  var src = new URLSearchParams(location.search).get("src");
  function withSrc(base, key) {
    if (!src) return base;
    return base + (base.indexOf("?") > -1 ? "&" : "?") + key + "=" + encodeURIComponent(src);
  }
  var hasIOS = !!IOS;
  var iosURL = hasIOS ? withSrc(IOS, "ct") : "";
  var androidURL = withSrc(ANDROID, "referrer");

  // Play-only markets (no iOS app): hide the App Store button.
  var iosBtn = document.getElementById("ios");
  if (hasIOS) { iosBtn.href = iosURL; } else { iosBtn.style.display = "none"; }
  document.getElementById("android").href = androidURL;

  var ua = navigator.userAgent || "";
  var isIOS = hasIOS && (/iPhone|iPad|iPod/i.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)); // iPadOS
  var isAndroid = /Android/i.test(ua);

  var hint = document.getElementById("hint");
  if (isIOS || isAndroid) {
    var target = isIOS ? iosURL : androidURL;
    var storeName = isIOS ? "the App Store" : "Google Play";
    hint.innerHTML = 'Opening ' + storeName + '… <a href="' + target + '">Tap here if it doesn’t.</a>';
    // Redirect after a beat so the card is briefly visible (and the redirect isn't
    // mistaken for a popup). replace() keeps it out of history.
    setTimeout(function () { location.replace(target); }, 350);
  } else {
    hint.textContent = "Choose your device to download.";
  }
})();
</script>
</body>
</html>
